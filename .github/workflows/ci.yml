# =============================================================================
# CI Workflow — runs on every push and pull request
#
# Jobs (in order):
#   lint   → ruff + black --check (fast feedback, no deps needed)
#   test   → pytest with coverage (full package install)
#   build  → Docker build smoke-test (validates Dockerfile compiles)
#
# The build job only runs on pushes to main or on version tags,
# to avoid wasting GitHub Actions minutes on every PR.
# =============================================================================

name: CI

on:
  push:
    branches: ["main", "develop"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main", "develop"]

# Cancel redundant runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mlops-predictive-maintenance

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint (ruff + black)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linters
        run: pip install "ruff>=0.4" "black>=24.0"

      - name: Run ruff
        run: ruff check src/ tests/

      - name: Run black (check mode)
        run: black --check src/ tests/

  # ---------------------------------------------------------------------------
  # Job 2: Test (pytest + coverage)
  # ---------------------------------------------------------------------------
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint          # only run tests if linting passes
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project + dev deps
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=junit.xml \
            -v
        env:
          # Point to a local file-based MLflow store so test_api.py can load
          # a mock model without needing a real registry
          MLFLOW_TRACKING_URI: mlruns

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false   # don't block CI if Codecov is down

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            junit.xml
            coverage.xml

  # ---------------------------------------------------------------------------
  # Job 3: Docker build smoke-test
  # Runs on: pushes to main, version tags; PRs only check build, not push.
  # ---------------------------------------------------------------------------
  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write      # needed to push to GHCR

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-platform)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GHCR only when we intend to push (main branch or tag)
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # Tag with version on version tags (e.g. v1.2.3 → 1.2.3, latest)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Tag with short SHA on every push
            type=sha,prefix=sha-
            # Tag latest on main
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build (and push on main / tags)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: runtime
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache: write on main, read-only on PRs
          cache-from: type=gha
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}
          platforms: linux/amd64
