[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops_pipeline"
version = "0.1.0"
description = "End-to-end MLOps pipeline for predictive maintenance on NASA CMAPSS turbofan data"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "mlflow>=2.13",
    "dvc>=3.50",
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "requests>=2.31",
    "tqdm>=4.66",
    "pyarrow>=14.0",          # parquet support for pandas
    "matplotlib>=3.7",        # feature importance plots
    "scipy>=1.11",            # KS-test, stats (used in drift detection later)
    # Phase 2 — API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "prometheus-client>=0.20",
    "httpx>=0.27",             # needed by FastAPI TestClient
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "black>=24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-dir]
"" = "."

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
